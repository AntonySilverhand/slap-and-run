'use strict';

// =====================================================================
//  SLAP & RUN!  —  slap strangers, then outrun them (they're faster).
// =====================================================================

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const chance = p => Math.random() < p;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const shadeCache = new Map();
function shade(hex, amt) {
  const key = hex + amt;
  let v = shadeCache.get(key);
  if (v) return v;
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  v = 'rgb(' + r + ',' + g + ',' + b + ')';
  shadeCache.set(key, v);
  return v;
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function txt(s, x, y, size, color, align = 'center', outline = true) {
  ctx.font = '900 ' + size + 'px "Arial Black","Segoe UI Black",Impact,system-ui,sans-serif';
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  if (outline) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, size * 0.17);
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function drawStar(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fill();
}
function heart(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.7, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.stroke();
}

let DPR = 1, CW = 0, CH = 0, S = 1, VW = 720, OY = 0, UI = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = window.innerWidth; CH = window.innerHeight;
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  S = Math.min(CH / VIEW_H, CW / 720);
  VW = CW / S;
  OY = (CH - VIEW_H * S) / 2;
  UI = clamp(Math.min(CW / 900, CH / 640), 0.6, 1.5);
}
window.addEventListener('resize', resize);
resize();

// ---------- audio (all synthesized) ----------
let AC = null, noiseBuf = null, muted = false;
function ac() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const len = AC.sampleRate * 0.6;
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function noise(dur, freq, q, gain, type = 'bandpass', freqEnd = 0, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t0 = a.currentTime + delay;
  const src = a.createBufferSource(); src.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(freq, t0);
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
function tone(freq, dur, type, gain, freqEnd = 0, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

function randType() {

function collide(e) {
  for (const o of activeObs) {
    const hw = o.w / 2, hh = o.h / 2;
    if (Math.abs(o.x - e.x) > hw + e.r || Math.abs(o.y - e.y) > hh + e.r) continue;
    const cx = clamp(e.x, o.x - hw, o.x + hw), cy = clamp(e.y, o.y - hh, o.y + hh);
    const dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
    if (d2 >= e.r * e.r) continue;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2), push = e.r - d;
      e.x += dx / d * push; e.y += dy / d * push;
    } else {
      const px = hw + e.r - Math.abs(e.x - o.x), py = hh + e.r - Math.abs(e.y - o.y);
      if (px < py) e.x += (e.x < o.x ? -1 : 1) * px; else e.y += (e.y < o.y ? -1 : 1) * py;
    }
  }
}

}

    if (Math.abs(o.x - e.x) > hw + 70 || Math.abs(o.y - e.y) > hh + 70) continue;
    const cx = clamp(e.x, o.x - hw, o.x + hw), cy = clamp(e.y, o.y - hh, o.y + hh);
    let nx = e.x - cx, ny = e.y - cy;

    nx /= d; ny /= d;

    if (toward <= 0) continue;
    const w = (1 - d / R) * toward * 2;
    let tx = -ny, ty = nx;
    const dot = tx * dx + ty * dy;
    if (Math.abs(dot) < 0.05) { if (ty * (CENTER_LINE - e.y) < 0) { tx = -tx; ty = -ty; } }
    else if (dot < 0) { tx = -tx; ty = -ty; }

      const dx = b.x - a.x;
      if (Math.abs(dx) > 40) continue;

function updateItems(dt) {

// ---------- update: player ----------
function updatePlayer(dt) {
  const p = player;
  p.slapT = Math.max(0, p.slapT - dt);
  p.slapCd = Math.max(0, p.slapCd - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  const [ix, iy] = gs === 'play' ? getInput() : [0, 0];
  let vx = 0, vy = 0;
  const infinite = power.energy > 0;
  if (p.downT > 0) {
    if (gs === 'play') p.downT -= dt;
    p.lie = p.downT > 0.3 ? Math.min(1, p.lie + dt * 8) : Math.max(0, p.downT / 0.3);
    p.kvx *= Math.exp(-5 * dt);
    vx = p.kvx;
    p.sprinting = false;
    if (p.downT <= 0) { p.downT = 0; p.lie = 0; p.kvx = 0; }
  } else {
    const moving = ix !== 0 || iy !== 0;
    if (p.stamina <= 0.01 && !infinite) p.winded = true;
    if (p.winded && (p.stamina >= WINDED_RECOVER || infinite)) p.winded = false;
    const sprint = gs === 'play' && sprintHeld() && moving && !p.winded && (p.stamina > 0 || infinite);
    if (sprint && !p.sprinting) sfx.sprint();
    p.sprinting = sprint;
    const boost = power.skates > 0 ? 1.55 : 1;
    const spd = (sprint ? SPRINT_SPEED : PLAYER_SPEED) * boost;
    vx = ix * spd; vy = iy * spd * 0.82;
    if (sprint && !infinite) p.stamina = Math.max(0, p.stamina - SPRINT_DRAIN * dt);
    if ((sprint || power.skates > 0) && Math.random() < 0.5) dust(p.x, p.y, 1);
    if (ix !== 0 && p.slapT <= 0) p.facing = ix > 0 ? 1 : -1;
  }
  if (!p.sprinting && p.stamina < STAMINA_NATURAL) p.stamina = Math.min(STAMINA_NATURAL, p.stamina + STAMINA_REGEN * dt);
  if (infinite) p.stamina = STAMINA_MAX;
  p.vx = vx; p.vy = vy;
  moveEntity(p, vx * dt, vy * dt);
  const sp = Math.hypot(vx, vy);
  p.moveAmt = p.downT > 0 ? 0 : Math.min(1, sp / 120);
  p.phase += dt * Math.min(sp, 300) / 16;
}

function walkBehaviour(q, dt) {

  if (q.photoT > 0) {
    q.photoT -= dt;
    if (!q.flashed && q.photoT < 0.6) {
      q.flashed = true;
      parts.push({ kind: 'flash', x: q.x + q.facing * 18, y: q.y, z: 70, vx: 0, vy: 0, vz: 0, g: 0, life: 0.25, size: 18, color: '#ffffff' });
      if (onScreen(q) && lastBubbleCount < 4) q.say = { text: '*click*', t: 1 };
    }

  }

  if (q.walkSpeed > 0) {
    if (q.pause > 0) q.pause -= dt;

const CAR_COLORS = ['#e74c3c', '#2980b9', '#ecf0f1', '#2c3e50', '#16a085', '#8e44ad', '#d35400', '#7f8c8d'];

    x: L.dir > 0 ? camX - 320 - len / 2 : camX + VW + 320 + len / 2, y: L.y, dir: L.dir,
    speed: bus ? rand(380, 460) : rand(430, 660), len, depth: 56, h: bus ? 82 : 46,

function updateCars(dt) {
  if (gs === 'play') {
    const rush = activeEvent && activeEvent.key === 'rushhour' ? 3 : 1;
    for (const L of LANES) {
      L.timer -= dt * rush;
      if (L.timer <= 0) { spawnCar(L); L.timer = rand(2.6, 6.5) * Math.max(0.55, 1 - elapsed / 240); }
    }
  }

    c.wheel += c.speed * dt / 11;
    if (!c.honked && gs === 'play') {
      const ahead = (player.x - c.x) * c.dir;

      if (Math.abs(q.x - c.x) < hx + q.r && Math.abs(q.y - c.y) < hy + 4) {
        const wasChase = q.state === 'chase';
        const keep = q.anger;

        q.angryAfter = wasChase;
        if (wasChase) q.angerMax = Math.max(3, keep) + 2;
        sfx.crash();
        if (wasChase && gs === 'play') {
          const pts = addScore(250); carHits++;

        }

function update(dt) {

  if (hitStop > 0) { hitStop -= dt; return; }
  if (gs === 'dying') dt *= 0.6;
  if (gs === 'play') elapsed += dt;

    const sc = p.big ? 1 + 0.7 * Math.max(0, 1 - age / 0.12) : 1;
    ctx.globalAlpha = clamp(p.life / p.max * 2.5, 0, 1);
    txt(p.text, p.x - camX, SKY_H + p.y - p.z, p.size * sc, p.color);
  }
  ctx.globalAlpha = 1;
  // speech bubbles
  ctx.font = 'bold 11px system-ui,"Segoe UI",sans-serif';
  for (const b of bubbles) {
    const w = ctx.measureText(b.text).width + 12, h = 17;
    ctx.globalAlpha = b.a;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 1.5;
    rr(b.x - w / 2, b.y - h, w, h, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; poly([b.x - 4, b.y - 1, b.x + 4, b.y - 1, b.x, b.y + 5]);
    ctx.beginPath(); ctx.moveTo(b.x - 4, b.y); ctx.lineTo(b.x, b.y + 5); ctx.lineTo(b.x + 4, b.y); ctx.stroke();
    ctx.fillStyle = '#2d3436'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.text, b.x, b.y - h / 2);
  }
  ctx.globalAlpha = 1;
  lastBubbleCount = bubbles.length;
  // off-screen chaser arrows
  for (const q of peds) {
    if (q.state !== 'chase') continue;
    const sx = q.x - camX;
    if (sx > 0 && sx < VW) continue;
    const left = sx <= 0, x = left ? 16 : VW - 16;
    const y = clamp(SKY_H + q.y - 40, SKY_H + 10, VIEW_H - 24);
    ctx.fillStyle = '#ff3838'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    if (left) poly([x - 10, y, x + 6, y - 11, x + 6, y + 11]); else poly([x + 10, y, x - 6, y - 11, x - 6, y + 11]);
    ctx.stroke();
    txt(Math.round(Math.abs(q.x - player.x) / 10) + 'm', left ? x + 22 : x - 22, y + 5, 12, '#ffffff');
  }
  // off-screen mystery boxes
  for (const it of items) {
    if (it.kind !== 'box') continue;
    const sx = it.x - camX;
    if (sx > 0 && sx < VW) continue;
    const left = sx <= 0, x = left ? 18 : VW - 18, y = clamp(SKY_H + it.y - 20, SKY_H + 10, VIEW_H - 24);
    ctx.fillStyle = '#f6c343'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.fill(); ctx.stroke();
    txt('?', x, y + 5, 14, '#ffffff');
  }
  // incoming car warnings
  for (const c of cars) {
    const sx = c.x - camX;
    const off = (c.dir > 0 && sx + c.len / 2 < 0) || (c.dir < 0 && sx - c.len / 2 > VW);
    if (!off || ((gameTime * 8) | 0) % 2) continue;
    const x = c.dir > 0 ? 26 : VW - 26, y = SKY_H + c.y - 10;
    ctx.fillStyle = '#feca57'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    poly([x, y - 18, x + 17, y + 12, x - 17, y + 12]); ctx.stroke();
    txt('!', x, y + 9, 18, '#000', 'center', false);
  }
}

// ---------- rendering: HUD / screens ----------
function drawHUD() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const u = UI, cx = CW / 2;
  if (gs === 'title') { drawTitle(); return; }
  txt(score.toLocaleString(), 20 * u, 46 * u, 38 * u, '#ffffff', 'left');
  txt('SLAPS ' + slaps + '    TIME ' + fmtTime(elapsed), 22 * u, 72 * u, 15 * u, '#ffe082', 'left');
  // active power-ups
  let py = 100 * u;
  for (const k in power) {
    if (power[k] <= 0) continue;
    const P = POWERS[k];
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; rr(18 * u, py - 14 * u, 170 * u, 28 * u, 8 * u); ctx.fill();
    drawIcon(k, 34 * u, py, 11 * u);
    txt(P.name, 52 * u, py + 1 * u, 11 * u, P.color, 'left');
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(52 * u, py + 5 * u, 128 * u, 4 * u);
    ctx.fillStyle = P.color; ctx.fillRect(52 * u, py + 5 * u, 128 * u * clamp(power[k] / P.dur, 0, 1), 4 * u);
    py += 32 * u;
  }
  // hearts + sprint
  for (let i = 0; i < MAX_HEARTS; i++) heart(CW - 30 * u - i * 34 * u, 32 * u, 13 * u, i < player.hearts ? '#ff4757' : 'rgba(255,255,255,0.25)');
  const bw = 150 * u, bh = 12 * u, bx = CW - 20 * u - bw, by = 58 * u;
  const infinite = power.energy > 0;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(bx - 3, by - 3, bw + 6, bh + 6, 4); ctx.fill();
  if (infinite) {
    ctx.fillStyle = 'hsl(' + ((gameTime * 300) % 360) + ',90%,60%)'; ctx.fillRect(bx, by, bw, bh);
  } else {
    ctx.fillStyle = player.winded ? '#7f8c8d' : player.sprinting ? '#7bed9f' : '#4cd137';
    ctx.fillRect(bx, by, bw * Math.min(player.stamina, STAMINA_NATURAL) / STAMINA_MAX, bh);
    if (player.stamina > STAMINA_NATURAL) { ctx.fillStyle = '#ffd32a'; ctx.fillRect(bx + bw * STAMINA_NATURAL / STAMINA_MAX, by, bw * (player.stamina - STAMINA_NATURAL) / STAMINA_MAX, bh); }
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(bx + bw * STAMINA_NATURAL / STAMINA_MAX, by, 2, bh);
  }
  const label = infinite ? 'SPRINT  UNLIMITED' : player.winded ? 'WINDED!' : 'SPRINT ' + (player.stamina / SPRINT_DRAIN).toFixed(1) + 's';
  txt(label, bx - 8 * u, by + bh, 13 * u, player.winded && !infinite ? '#ff6b6b' : '#ffffff', 'right');
  // combo / chasers / event
  let y = 46 * u;
  if (combo > 1) {
    const f = clamp(1 - (elapsed - lastSlapT) / COMBO_WINDOW, 0, 1);
    txt('COMBO x' + combo, cx, y, (28 + combo * 2) * u, combo >= 5 ? '#ff6b81' : '#ffdd59');
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(cx - 80 * u, y + 8 * u, 160 * u, 6 * u);
    ctx.fillStyle = '#ffdd59'; ctx.fillRect(cx - 80 * u, y + 8 * u, 160 * u * f, 6 * u);
    y += 40 * u;
  }
  let nc = 0;
  for (const q of peds) if (q.state === 'chase') nc++;
  if (nc > 0 && gs === 'play') {
    const pulse = 1 + Math.sin(gameTime * 10) * 0.05;
    txt(nc + (nc > 1 ? ' CHASING YOU!' : ' CHASING YOU!'), cx, y, 18 * u * pulse, '#ff6b6b');
    txt('HEAT BONUS x' + (1 + 0.5 * nc).toFixed(1), cx, y + 20 * u, 13 * u, '#ffa502');
    y += 44 * u;
  }
  if (activeEvent) {
    const E = EVENTS[activeEvent.key];
    txt(E.name + '  ' + Math.ceil(activeEvent.t) + 's', cx, y, 15 * u, E.color);
  }
  // inventory slots
  const SR = slotRects();
  for (let i = 0; i < MAX_ITEMS; i++) {
    const r = SR[i], k = inventory[i];
    ctx.fillStyle = k ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.35)';
    ctx.strokeStyle = k ? POWERS[k].color : 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3;
    rr(r.x, r.y, r.s, r.s, 10 * u); ctx.fill(); ctx.stroke();
    if (k) drawIcon(k, r.x + r.s / 2, r.y + r.s / 2, r.s * 0.34);
    if (!touchMode) txt(String(i + 1), r.x + 8 * u, r.y + 14 * u, 11 * u, '#ffffff', 'center');
  }
  if (!touchMode && inventory.length) txt('E = use first item', SR[1].x + SR[1].s / 2, SR[0].y - 8 * u, 11 * u, '#ffffff');
  if (gs === 'play' && slaps === 0 && elapsed < 25) {
    txt('Just run into someone — the slap is automatic!', cx, CH - (touchMode ? 170 : 105) * u, 18 * u, '#ffffff');
  }
  if (!touchMode && gs === 'play') {
    ctx.globalAlpha = 0.6;
    txt('WASD move · hold SHIFT sprint · E item · SPACE re-slap chaser · P pause · M sound ' + (muted ? 'OFF' : 'ON'), 14 * u, CH - 10 * u, 10 * u, '#ffffff', 'left');
    ctx.globalAlpha = 1;
  }
  if (touchMode && gs === 'play') drawTouch();
  if (banner) {
    const age = banner.max - banner.t;
    const sc = 1 + 0.5 * Math.max(0, 1 - age / 0.15);
    ctx.globalAlpha = clamp(banner.t * 2.5, 0, 1);
    txt(banner.title, cx, CH * 0.33, 46 * u * sc, banner.color);
    txt(banner.sub, cx, CH * 0.33 + 30 * u, 17 * u, '#ffffff');
    ctx.globalAlpha = 1;
  }
  if (gs === 'paused') {
    ctx.fillStyle = 'rgba(10,12,20,0.6)'; ctx.fillRect(0, 0, CW, CH);
    txt('PAUSED', cx, CH / 2, 64 * u, '#ffffff');
    txt(touchMode ? 'Tap to resume' : 'Press P or SPACE to resume', cx, CH / 2 + 40 * u, 18 * u, '#dfe6e9');
  }
  if (gs === 'over') drawOver();
}
function drawTouch() {
  const B = touchButtons(), u = B.u;
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff';
  ctx.fillStyle = sprintTouch !== null ? 'rgba(123,237,159,0.95)' : player.winded ? 'rgba(127,140,141,0.7)' : 'rgba(76,209,55,0.85)';
  circle(B.sprint.x, B.sprint.y, B.sprint.r);
  ctx.beginPath(); ctx.arc(B.sprint.x, B.sprint.y, B.sprint.r, 0, TAU); ctx.stroke();
  txt('SPRINT', B.sprint.x, B.sprint.y + 6 * u, 16 * u, '#ffffff');
  if (joy.active) {
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; circle(joy.ox, joy.oy, 60 * u);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; circle(joy.ox + joy.vx * 60 * u, joy.oy + joy.vy * 60 * u, 24 * u);
  }
  ctx.globalAlpha = 1;
}
function drawTitle() {
  const u = UI, cx = CW / 2;
  ctx.fillStyle = 'rgba(10,12,20,0.55)'; ctx.fillRect(0, 0, CW, CH);
  let y = CH * 0.2;
  ctx.save();
  ctx.translate(cx, y); ctx.rotate(-0.05 + Math.sin(gameTime * 2) * 0.015);
  txt('SLAP & RUN!', 0, 0, 84 * u, '#ffdd59');
  ctx.restore();
  y += 48 * u;
  txt('Slap strangers. They get back up angry — and they run FASTER than you.', cx, y, 17 * u, '#ffffff');
  y += 24 * u;
  txt('Slap as many as you dare. Get caught 5 times and you\'re busted.', cx, y, 15 * u, '#dfe6e9');
  y += 40 * u;
  const lines = touchMode
    ? ['Drag on the left side to move — slaps are automatic!', 'Hold SPRINT to run fast · tap item slots to use them']
    : ['MOVE  —  WASD / Arrow keys', 'SLAP  —  automatic! Just run into people', 'SPRINT  —  hold SHIFT / K  (slaps refill it!)',
      'ITEMS  —  grab ? boxes, use with E or 1-3', 'RE-SLAP A CHASER  —  SPACE      PAUSE  —  P      SOUND  —  M'];
  for (const l of lines) { txt(l, cx, y, 16 * u, '#ffe082'); y += 24 * u; }
  y += 12 * u;
  const tips = ['Mystery boxes hold UFOs, banana peels, mega slaps, decoys, disguises and more.',
    'Watch for street events: marathons, rush hour, double points, flash mobs, police patrols.',
    'Cops chase anyone they see slapping. Karate masters block. Dogs defend their owners.'];
  for (const t of tips) { txt(t, cx, y, 13 * u, '#c8d6e5'); y += 20 * u; }
  if (((gameTime * 2) | 0) % 2 === 0) txt(touchMode ? 'TAP TO START' : 'PRESS SPACE TO START', cx, Math.max(y + 36 * u, CH * 0.88), 28 * u, '#ff6b6b');
  if (best > 0) txt('BEST ' + best.toLocaleString(), cx, Math.max(y + 66 * u, CH * 0.88 + 30 * u), 15 * u, '#ffe082');
}
function drawOver() {
  const u = UI, cx = CW / 2;
  ctx.fillStyle = 'rgba(10,12,20,' + Math.min(0.68, overT * 1.2) + ')'; ctx.fillRect(0, 0, CW, CH);
  let y = CH * 0.28;
  txt('BUSTED!', cx, y, 80 * u, '#ff4757');
  y += 62 * u;
  txt('SCORE  ' + score.toLocaleString(), cx, y, 38 * u, '#ffffff');
  if (newBest && ((gameTime * 3) | 0) % 2 === 0) txt('NEW BEST!', cx, y + 34 * u, 22 * u, '#ffdd59');
  y += 74 * u;
  txt('Faces slapped: ' + slaps + '     Best combo: x' + bestCombo, cx, y, 17 * u, '#ffe082'); y += 26 * u;
  txt('Traffic takedowns: ' + carHits + '     Boxes opened: ' + boxesOpened + '     Survived: ' + fmtTime(elapsed), cx, y, 17 * u, '#ffe082'); y += 26 * u;
  txt('Best score: ' + best.toLocaleString(), cx, y, 15 * u, '#c8d6e5');
  if (overT > 0.9 && ((gameTime * 2) | 0) % 2 === 0) txt(touchMode ? 'TAP TO PLAY AGAIN' : 'PRESS SPACE TO PLAY AGAIN', cx, y + 60 * u, 26 * u, '#ff6b6b');
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#d6cfc2';
  ctx.fillRect(0, 0, CW, CH);
  drawWorld();
  drawHUD();
}

// ---------- main loop ----------
reset();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
